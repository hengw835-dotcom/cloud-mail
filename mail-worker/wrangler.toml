name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"

[[kv_namespaces]]
binding = "kv"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
domain = ["wangheng0300.xyz"]
admin = "Hengw835@gmail.com"

#ai_model = ""
#analysis_cache = false
#orm_log = false

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
